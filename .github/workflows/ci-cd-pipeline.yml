---
name: Voting App CI/CD

on:
  push:
    branches:
      - main
      - feature/terraform-state
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-sudha
  DOCKERHUB_USERNAME: sudharanipanchangam

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          push: true
          tags: sudharanipanchangam/vote:latest

      - name: Build and push Result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          push: true
          tags: sudharanipanchangam/result:latest

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: sudharanipanchangam/worker:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/vote vote=sudharanipanchangam/vote:latest
          kubectl set image deployment/result result=sudharanipanchangam/result:latest
          kubectl set image deployment/worker worker=sudharanipanchangam/worker:latest

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/vote --timeout=180s
          kubectl rollout status deployment/result --timeout=180s
          kubectl rollout status deployment/worker --timeout=180s
